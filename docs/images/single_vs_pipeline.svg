<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="900" height="420" fill="#fcfcfb"/><text x="24" y="34" font-size="18" font-weight="700" fill="#0b0b0b">Single-cycle vs 5-stage pipeline</text><text x="24" y="56" font-size="12" fill="#52514e">Vivado 2025.1 synthesis, Artix-7 xc7a15t-3, 10 ns clock constraint, both cores running fulltest from the same ROM</text><rect x="620" y="22" width="12" height="12" rx="2" fill="#2a78d6"/><text x="638" y="33" font-size="12" fill="#0b0b0b">single-cycle</text><rect x="740" y="22" width="12" height="12" rx="2" fill="#eb6834"/><text x="758" y="33" font-size="12" fill="#0b0b0b">pipeline</text><text x="24" y="86" font-size="13" font-weight="600" fill="#0b0b0b">Fmax (MHz) — higher is better</text><text x="24" y="103" font-size="11" fill="#52514e">T = 18.7 ns vs 6.51 ns</text><text x="24" y="140" font-size="12" fill="#52514e">single</text><path d="M88,118 h100.4921875 a4,4 0 0 1 4,4 v28 a4,4 0 0 1 -4,4 h-100.4921875 z" fill="#2a78d6"><title>single: 54 MHz</title></path><text x="200.4921875" y="140" font-size="12" font-weight="600" fill="#0b0b0b">54 MHz</text><text x="24" y="184" font-size="12" fill="#52514e">pipeline</text><path d="M88,162 h296.0 a4,4 0 0 1 4,4 v28 a4,4 0 0 1 -4,4 h-296.0 z" fill="#eb6834"><title>pipeline: 154 MHz</title></path><text x="396.0" y="184" font-size="12" font-weight="600" fill="#0b0b0b">154 MHz</text><line x1="88" y1="112" x2="88" y2="202" stroke="#a8a7a0" stroke-width="1"/><text x="464" y="86" font-size="13" font-weight="600" fill="#0b0b0b">fulltest run time (ns) — lower is better</text><text x="464" y="103" font-size="11" fill="#52514e">72 cycles vs 100 cycles</text><text x="464" y="140" font-size="12" fill="#52514e">single</text><path d="M528,118 h296.0 a4,4 0 0 1 4,4 v28 a4,4 0 0 1 -4,4 h-296.0 z" fill="#2a78d6"><title>single: 1345 ns</title></path><text x="836.0" y="140" font-size="12" font-weight="600" fill="#0b0b0b">1345 ns</text><text x="464" y="184" font-size="12" fill="#52514e">pipeline</text><path d="M528,162 h141.20877944325483 a4,4 0 0 1 4,4 v28 a4,4 0 0 1 -4,4 h-141.20877944325483 z" fill="#eb6834"><title>pipeline: 651 ns</title></path><text x="681.2087794432548" y="184" font-size="12" font-weight="600" fill="#0b0b0b">651 ns</text><line x1="528" y1="112" x2="528" y2="202" stroke="#a8a7a0" stroke-width="1"/><text x="24" y="251" font-size="13" font-weight="600" fill="#0b0b0b">LUTs</text><text x="24" y="268" font-size="11" fill="#52514e">+14%</text><text x="24" y="305" font-size="12" fill="#52514e">single</text><path d="M88,283 h259.16894018887723 a4,4 0 0 1 4,4 v28 a4,4 0 0 1 -4,4 h-259.16894018887723 z" fill="#2a78d6"><title>single: 836</title></path><text x="359.16894018887723" y="305" font-size="12" font-weight="600" fill="#0b0b0b">836</text><text x="24" y="349" font-size="12" fill="#52514e">pipeline</text><path d="M88,327 h296.0 a4,4 0 0 1 4,4 v28 a4,4 0 0 1 -4,4 h-296.0 z" fill="#eb6834"><title>pipeline: 953</title></path><text x="396.0" y="349" font-size="12" font-weight="600" fill="#0b0b0b">953</text><line x1="88" y1="277" x2="88" y2="367" stroke="#a8a7a0" stroke-width="1"/><text x="464" y="251" font-size="13" font-weight="600" fill="#0b0b0b">Flip-flops</text><text x="464" y="268" font-size="11" fill="#52514e">pipeline registers</text><text x="464" y="305" font-size="12" fill="#52514e">single</text><path d="M528,283 h14.568665377176014 a4,4 0 0 1 4,4 v28 a4,4 0 0 1 -4,4 h-14.568665377176014 z" fill="#2a78d6"><title>single: 32</title></path><text x="554.568665377176" y="305" font-size="12" font-weight="600" fill="#0b0b0b">32</text><text x="464" y="349" font-size="12" fill="#52514e">pipeline</text><path d="M528,327 h296.0 a4,4 0 0 1 4,4 v28 a4,4 0 0 1 -4,4 h-296.0 z" fill="#eb6834"><title>pipeline: 517</title></path><text x="836.0" y="349" font-size="12" font-weight="600" fill="#0b0b0b">517</text><line x1="528" y1="277" x2="528" y2="367" stroke="#a8a7a0" stroke-width="1"/><text x="24" y="406" font-size="11" fill="#52514e">Single-cycle Fmax is limited by its full datapath landing on the falling-edge register-file write (half a cycle). Pipeline Fmax is limited by the Execute stage.</text></svg>